packages:
  - "."

allowBuilds:
  core-js: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

overrides:
  # alchemy 2.0.0-beta.79 の CLI は effect/unstable/cli を使う。これがあるのは effect 4.0.0-rc.117 まで。
  # @effect/* も同じ rc にそろえる（範囲指定のままだと 4.1 系に上がり、alchemy が起動しない）。
  # alchemy を上げるときに一緒に外す。
  "@effect/platform-node-shared": 4.0.0-rc.117
  "@effect/sql-d1": 4.0.0-rc.117
  "@effect/sql-sqlite-do": 4.0.0-rc.117
  "@effect/vitest": 4.0.0-rc.117
  vite: 8.3.8
  browserslist: ">=4.28.7"
  dompurify: ">=3.4.17"
  fast-uri: ">=3.1.6"
  picomatch: ">=2.3.2"
  sharp: ">=0.35.4"
  smol-toml: ">=1.7.1"
  source-map-js: ">=1.2.2"
  "undici@>=7.0.0 <8.0.0": "7.30.1"
  "undici@>=8.0.0": "8.12.3"

minimumReleaseAgeExclude:
  - alchemy@2.0.0-beta.79
  - posthog-js@1.434.0
  - wrangler@4.134.0
  - wrangler@4.158.0
  - '@posthog/core@1.54.5'
  - '@posthog/types@1.412.2'
  - '@alchemy.run/cloudflare-runtime@2.0.0-beta.79'
  - '@alchemy.run/floci@2.0.0-beta.79'
  - '@alchemy.run/node-utils@2.0.0-beta.79'
  - '@distilled.cloud/aws@1.0.0-rc.12'
  - '@distilled.cloud/axiom@1.0.0-rc.12'
  - '@distilled.cloud/cloudflare@1.0.0-rc.12'
  - '@distilled.cloud/core@1.0.0-rc.12'
  - '@distilled.cloud/fly-io@1.0.0-rc.12'
  - '@distilled.cloud/hetzner@1.0.0-rc.12'
  - '@distilled.cloud/neon@1.0.0-rc.12'
  - '@distilled.cloud/planetscale@1.0.0-rc.12'
  - '@distilled.cloud/prisma@1.0.0-rc.12'
  - '@distilled.cloud/railway@1.0.0-rc.12'
  - '@distilled.cloud/stripe@1.0.0-rc.12'
  - miniflare@5.20260917.0-alpha
