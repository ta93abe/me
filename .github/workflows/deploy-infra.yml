# Cloudflare インフラ（infra/alchemy.run.ts）の Plan / デプロイ
#
# - PR で infra/** か依存（package.json / lockfile / pnpm-workspace.yaml）に変更がある場合:
#   alchemy の CLI が起動するかを確かめ、alchemy plan（dry-run）を実行しログで差分を確認できる
#   （Secrets を持たない Dependabot の PR では CLI の起動確認だけ）
# - main への push で infra/** に変更がある場合: alchemy deploy を実行
# - 依存だけを変えたときの反映は workflow_dispatch（main）で行う
#
# 必要な Secrets:
# - CLOUDFLARE_API_TOKEN: Workers Scripts Write / Workers R2 Storage Write /
#   Secrets Store Write（Alchemy のステートストア読み書きに必須）/
#   Zone > Workers Routes・DNS Write（カスタムドメイン接続用）を持つトークン
# - CLOUDFLARE_ACCOUNT_ID: b0047256d1afc1be1df08289ee3be552
name: Deploy Infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  pull_request:
    paths:
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # effect などの更新で alchemy の CLI が壊れたことがある（effect/unstable/cli）。認証なしで起動だけ確かめる
      - name: Alchemy CLI loads
        run: pnpm exec alchemy --help > /dev/null
      - name: Plan infra changes
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: pnpm infra:plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy infra
        run: pnpm infra:deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
