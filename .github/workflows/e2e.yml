# Playwright
#
# PR: Chromium @smoke（ジョブ名は常に出す。docs だけなら本体は skip）
# main: Chromium 全件
# 週次 / 手動 browsers: Firefox + WebKit
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which Playwright suite"
        type: choice
        options:
          - smoke
          - chromium
          - browsers
        default: chromium

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: E2E smoke (Chromium)
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Playwright-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -Eq '^(src/|public/|tests/|worker/|scripts/|infra/|playwright.config.ts|package.json|pnpm-lock.yaml|astro.config.mjs|wrangler.jsonc|\.github/workflows/e2e.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/setup@v3
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Run smoke tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        run: pnpm test:e2e:smoke

      - name: Skip smoke (docs-only)
        if: github.event_name == 'pull_request' && steps.filter.outputs.run != 'true'
        run: echo "No Playwright-relevant paths; smoke is a no-op success."

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true') }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  chromium:
    name: E2E Chromium
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'chromium')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Chromium tests
        run: pnpm exec playwright test --project=chromium

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

  browsers:
    name: E2E Firefox / WebKit
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'browsers')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox and WebKit
        run: pnpm exec playwright install firefox webkit --with-deps

      - name: Run Firefox and WebKit tests
        run: pnpm exec playwright test --project=firefox --project=webkit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-browsers
          path: playwright-report/
          retention-days: 14
